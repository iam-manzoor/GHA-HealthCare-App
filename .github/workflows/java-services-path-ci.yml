name: Java Microservices Path CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "healthcare-microservices/appointment-service/**"
      - "healthcare-microservices/doctor-service/**"
      - "healthcare-microservices/patient-service/**"
      - "healthcare-microservices/report-service/**"
      - "healthcare-microservices/user-service/**"
      - ".github/workflows/java-services-path-ci.yml"
  pull_request:
    paths:
      - "healthcare-microservices/appointment-service/**"
      - "healthcare-microservices/doctor-service/**"
      - "healthcare-microservices/patient-service/**"
      - "healthcare-microservices/report-service/**"
      - "healthcare-microservices/user-service/**"
      - ".github/workflows/java-services-path-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Pull request given read permission to access the repository contents.
  pull-requests: read

env:
  JAVA_VERSION: "22"
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || github.repository_owner }}

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # outputs section stores list of changed services and their count.
    # It gets the values at the end of each step and makes them avaoalbel to other jobs in the workflow.
    # Variable initilization to store the outcome of the job.
    outputs:
      services: ${{ steps.service-matrix.outputs.services }}
      service_count: ${{ steps.service-matrix.outputs.service_count }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        # Git commit history download. fetch-depth: 0 entire commit history. 1 only the latest commit. 2 last two commits, and so on. 
        # 0 is required for the paths-filter action to work correctly.
        with:
          fetch-depth: 0
        timeout-minutes: 5

      - name: Detect changed service paths
        id: filter
        # The condition ensures that it executes only for push and pull request events.
        if: ${{ github.event_name != 'workflow_dispatch' }}
        # The dorny/paths-filter action is used to detect changes in specific paths of the repository.
        uses: dorny/paths-filter@v3
        timeout-minutes: 3
        with:
          filters: |
            appointment-service:
              - "healthcare-microservices/appointment-service/**"
              - ".github/workflows/java-services-path-ci.yml"
            doctor-service:
              - "healthcare-microservices/doctor-service/**"
              - ".github/workflows/java-services-path-ci.yml"
            patient-service:
              - "healthcare-microservices/patient-service/**"
              - ".github/workflows/java-services-path-ci.yml"
            report-service:
              - "healthcare-microservices/report-service/**"
              - ".github/workflows/java-services-path-ci.yml"
            user-service:
              - "healthcare-microservices/user-service/**"
              - ".github/workflows/java-services-path-ci.yml"

      - name: Debug paths-filter outputs
        run: |
          echo "Changes = '${{ steps.filter.outputs.changes }}'"
          echo "Count   = '${{ steps.filter.outputs.count }}'"

# Resulting values gets stored in the outputs of the step stored in the temporary environment variables CHANGED_SERVICES and SERVICE_COUNT. These values are then used to set the outputs of the job.
      - name: Build service matrix
        id: service-matrix
        timeout-minutes: 1
        env:
          CHANGED_SERVICES: ${{ steps.filter.outputs.changes }}
          SERVICE_COUNT: ${{ steps.filter.outputs.count }}
# The following step sets the outputs of the job based on the event type. 
# If the event is a workflow_dispatch, it sets the outputs to include all services. Otherwise, it uses the values from the previous step.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'services=["appointment-service","doctor-service","patient-service","report-service","user-service"]' >> "$GITHUB_OUTPUT"
            echo 'service_count=5' >> "$GITHUB_OUTPUT"
          else
            echo "services=${CHANGED_SERVICES:-[]}" >> "$GITHUB_OUTPUT"
            echo "service_count=${SERVICE_COUNT:-0}" >> "$GITHUB_OUTPUT"
          fi

  unit-test:
    name: Unit tests - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    defaults:
      run:
        working-directory: healthcare-microservices/${{ matrix.service }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up JDK
        uses: actions/setup-java@v4
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit tests
        timeout-minutes: 10
        run: mvn -B -ntp test

  sonar:
    name: Sonar analysis - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - detect-changes
      - unit-test
    if: ${{ needs.detect-changes.outputs.service_count != '0' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    defaults:
      run:
        working-directory: healthcare-microservices/${{ matrix.service }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up JDK
        uses: actions/setup-java@v4
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests and Sonar analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        timeout-minutes: 15
        run: >
          mvn -B -ntp verify sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ env.SONAR_ORGANIZATION }}_${{ matrix.service }}
          -Dsonar.projectName=${{ matrix.service }}

      - name: Skip Sonar analysis
        if: ${{ env.SONAR_TOKEN == '' }}
        timeout-minutes: 1
        run: echo "SONAR_TOKEN is not configured; skipping Sonar analysis."

  docker-build:
    name: Docker build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - detect-changes
      - unit-test
      - sonar
    if: ${{ needs.detect-changes.outputs.service_count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        timeout-minutes: 5

      - name: Build service image
        timeout-minutes: 15
        uses: docker/build-push-action@v6
        with:
          context: ./healthcare-microservices/${{ matrix.service }}
          push: false
          tags: healthcare/${{ matrix.service }}:ci
